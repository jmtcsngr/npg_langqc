# npg_langqc devcontainer — HTTP-only Apache vhost.
#
# Bind-mounted over /etc/apache2/sites-enabled/000-default.conf to REPLACE the
# image's shipped vhost, which enables SSL and references /certs/cert.pem (Apache
# would refuse to start without that certificate). Here TLS is terminated by the
# Codespaces edge, so this vhost is plain HTTP and needs no certificate.
#
# Auth: instead of a real OIDC handshake, a fixed dev identity is injected as the
# oidc_claim_email header the backend already trusts. Any client-supplied value
# is stripped first so it cannot be spoofed. Set DEV_OIDC_EMAIL to change the user.
#
# Generated by:    Claude Opus 4.8 (1M context)
# Generation date: 2026-07-31

<VirtualHost *:80>
    # API: strip the /api prefix (backend has no prefix). Also expose /openapi/.
    ProxyPass        /openapi/ http://lang_qc:8181/openapi/
    ProxyPassReverse /openapi/ http://lang_qc:8181/openapi/
    ProxyPass        /api/ http://lang_qc:8181/
    ProxyPassReverse /api/ http://lang_qc:8181/

    # Frontend (Vite dev server, base /ui/).
    ProxyPass        /ui/ http://longue_vue/ui/
    ProxyPassReverse /ui/ http://longue_vue/ui/

    # Dev auth bypass: never trust a client-supplied identity, inject a fixed one.
    RequestHeader unset oidc_claim_email
    RequestHeader set oidc_claim_email "${DEV_OIDC_EMAIL}"

    # Send the bare root to the web app.
    RedirectMatch 301 ^/$ /ui/

    ServerName localhost
</VirtualHost>
