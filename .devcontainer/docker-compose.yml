# npg_langqc devcontainer stack.
#
# Step 2: adds the two MySQL databases the app talks to —
#   - mlwh_db : the multi-LIMS warehouse (read-only upstream data)  on port 3306
#   - qc_db   : the LangQC QC database (read-write)                 on port 3307
# The `workspace` service is where VS Code / Codespaces attaches. The backend
# API, frontend and Apache proxy are added as sibling services in later steps.
#
# Ports mirror tests/testdb.ini (3306 MLWH, 3307 QC) so the same credentials
# work for pytest. Databases are reachable by service name from inside the
# network (mlwh_db:3306, qc_db:3307) and via forwarded localhost ports on the
# host / Codespace.
#
# Generated by:    Claude Opus 4.8 (1M context)
# Generation date: 2026-07-31
# Last modified by: Claude Opus 4.8 (1M context)
# Last modified:    2026-07-31

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:3.10
    # Mount the parent of the repo at /workspaces so the repo lands at
    # /workspaces/<repo-name>, matching devcontainer.json's workspaceFolder.
    volumes:
      - ../..:/workspaces:cached
    # Keep the container alive; the editor drives everything else.
    command: sleep infinity
    environment:
      # MLWH (read-only upstream data), consumed by lang_qc via DB_URL.
      DB_URL: "mysql+pymysql://test:test@mlwh_db:3306/mlwarehouse?charset=utf8mb4"
      # QC database (read-write), consumed by lang_qc via QCDB_URL.
      QCDB_URL: "mysql+pymysql://test:test@qc_db:3307/langqc?charset=utf8mb4"
      # Alembic reads its own env var (see alembic/env.py) for QC migrations.
      ALEMBIC_DB_URL: "mysql+pymysql://test:test@qc_db:3307/langqc?charset=utf8mb4"
    depends_on:
      mlwh_db:
        condition: service_healthy
      qc_db:
        condition: service_healthy

  mlwh_db:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_TCP_PORT: "3306"
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: mlwarehouse
    ports:
      - "3306:3306"
    healthcheck:
      # `mysqladmin ping` returns success once the server accepts connections,
      # regardless of credentials; --silent makes it exit non-zero if it can't.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qc_db:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_TCP_PORT: "3307"
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: langqc
    ports:
      - "3307:3307"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3307 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
