# npg_langqc devcontainer stack. Services:
#   workspace  — where VS Code / Codespaces attaches
#   mlwh_db    — MLWH warehouse (read-only), port 3306
#   qc_db      — LangQC QC database (read-write), port 3307
#   lang_qc    — FastAPI backend, port 8181
#   longue_vue — Vue/Vite frontend, base /ui/, port 80
#   proxy      — Apache (HTTP), one origin for /api + /ui, published :8443
#
# Ports 3306/3307 mirror tests/testdb.ini so the same credentials drive pytest.
# See README.md for ports and database access.
#
# Generated by:    Claude Opus 4.8 (1M context)
# Generation date: 2026-07-31
# Last modified by: Claude Opus 4.8 (1M context)
# Last modified:    2026-08-13

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:3.14
    # Mount the parent of the repo at /workspaces so the repo lands at
    # /workspaces/<repo-name>, matching devcontainer.json's workspaceFolder.
    volumes:
      - ../..:/workspaces:cached
    # Keep the container alive; the editor drives everything else.
    command: sleep infinity
    environment:
      # MLWH (read-only upstream data), consumed by lang_qc via DB_URL.
      DB_URL: "mysql+pymysql://test:test@mlwh_db:3306/mlwarehouse?charset=utf8mb4"
      # QC database (read-write), consumed by lang_qc via QCDB_URL.
      QCDB_URL: "mysql+pymysql://test:test@qc_db:3307/langqc?charset=utf8mb4"
      # Alembic reads its own env var (see alembic/env.py) for QC migrations.
      ALEMBIC_DB_URL: "mysql+pymysql://test:test@qc_db:3307/langqc?charset=utf8mb4"
    # Ordering only — NOT `condition: service_healthy`: a slow first-time MySQL
    # init would fail the build (Codespaces recovery mode). setup.sh waits for
    # readiness instead. Same reasoning for the other services below.
    depends_on:
      - mlwh_db
      - qc_db

  mlwh_db:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_TCP_PORT: "3306"
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: mlwarehouse
    ports:
      - "3306:3306"
    healthcheck:
      # `mysqladmin ping` returns success once the server accepts connections,
      # regardless of credentials; --silent makes it exit non-zero if it can't.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  qc_db:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_TCP_PORT: "3307"
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: langqc
    ports:
      - "3307:3307"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3307 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  lang_qc:
    build:
      # Build the repo's own Dockerfile (development target). That target does
      # not COPY the app in; lang_qc/ is bind-mounted below so edits hot-reload.
      context: ..
      dockerfile: Dockerfile
      target: development
    volumes:
      - ../lang_qc:/code/lang_qc:cached
    command: uvicorn lang_qc.main:app --host 0.0.0.0 --port 8181 --reload
    environment:
      DB_URL: "mysql+pymysql://test:test@mlwh_db:3306/mlwarehouse?charset=utf8mb4"
      QCDB_URL: "mysql+pymysql://test:test@qc_db:3307/langqc?charset=utf8mb4"
    ports:
      - "8181:8181"
    depends_on:
      - mlwh_db
      - qc_db

  longue_vue:
    # frontend/.env must exist before build (see initializeCommand).
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ../frontend/src:/code/longue_vue/src:cached
      - ../frontend/public:/code/longue_vue/public:cached
    # Serves on :80 at base /ui/; published as :8080 on the host.
    ports:
      - "8080:80"

  proxy:
    # Override the image's SSL vhost with our HTTP-only one (see proxy/000-default.conf).
    build:
      context: ../docker/proxy
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./proxy/000-default.conf:/etc/apache2/sites-enabled/000-default.conf:ro
      - ./proxy/index.html:/var/www/html/index.html:ro
    environment:
      # Dev identity injected as the oidc_claim_email header; matches a seeded QC user.
      DEV_OIDC_EMAIL: dev@example.com
    # Emulate production's mod_auth_openidc "OIDCInfoHook userinfo": write a tiny
    # JSON document reporting DEV_OIDC_EMAIL, which the frontend reads from
    # /login-redirect?info=json to learn who is logged in (see proxy/000-default.conf).
    # Generated from the same env var as the header so the two never drift.
    command:
      - /bin/sh
      - -c
      - printf '{"userinfo":{"email":"%s"}}' "$$DEV_OIDC_EMAIL" > /var/www/html/login-redirect && exec /start.sh
    ports:
      - "8443:80"
    # Ordering only. A transient 502 before Vite is listening self-heals.
    depends_on:
      - lang_qc
      - longue_vue
